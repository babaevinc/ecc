# «Мой склад»: hardening on top of the official self-hosted Supabase compose (self-hosted/v0.8.3).
# Enabled by install.sh with `sh run.sh config add moysklad`.
#
# Docker publishes ports past ufw, so the official `${POSTGRES_PORT}:5432` would open the database to
# the whole internet. Here the pooler listens on the server itself only; reach it over SSH if needed.
services:
  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543"
