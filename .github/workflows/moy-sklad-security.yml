name: moy-sklad security (ZAP + Locust)

# Active tests run ONLY against the throwaway test API started inside this runner
# (http://127.0.0.1:8787, see moy-sklad/orchestrator/scope.json). Never point them elsewhere.
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'moy-sklad/backend/**'
      - 'moy-sklad/orchestrator/**'
      - 'moy-sklad/tests/load/**'
      - '.github/workflows/moy-sklad-security.yml'

permissions:
  contents: read

concurrency:
  group: moy-sklad-security-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: moy-sklad

env:
  MS_ENV: ci

jobs:
  dast:
    name: OWASP ZAP baseline + Locust load test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install Locust
        run: python -m pip install locust==2.32.4
      - name: Confirm the target is inside the approved scope
        run: node orchestrator/guard.js --target http://127.0.0.1:8787
      - name: Run ZAP and Locust through the orchestrator
        run: node orchestrator/run.js --stages zap,load --target http://127.0.0.1:8787 --dispatch none --strict
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: moy-sklad-dast
          path: moy-sklad/reports
          if-no-files-found: ignore
