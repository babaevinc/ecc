name: moy-sklad deploy (production)

# Production deploy is never automatic:
#  1. a person starts it by hand and types DEPLOY;
#  2. all checks run again on the exact commit;
#  3. the deploy job waits in the GitHub environment "production" until a required reviewer approves it
#     (Settings → Environments → production → Required reviewers).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm a production release'
        required: true

permissions:
  contents: read

concurrency:
  group: moy-sklad-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: moy-sklad

jobs:
  verify:
    name: Re-verify before release
    if: inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MS_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node orchestrator/run.js --stages unit,deps,e2e,access-control,red-team --dispatch none --strict

  deploy:
    name: Deploy to production (manual approval)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check what can be deployed
        id: pre
        run: |
          db=false; app=false
          if [ -d backend/supabase/migrations ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then db=true; fi
          if [ -f app/package.json ] && [ -n "$EXPO_TOKEN" ]; then app=true; fi
          echo "db=$db" >> "$GITHUB_OUTPUT"; echo "app=$app" >> "$GITHUB_OUTPUT"
          if [ "$db" = false ] && [ "$app" = false ]; then echo "::notice::Nothing to deploy yet: no migrations/app or production secrets are not configured."; fi
      - uses: supabase/setup-cli@v1
        if: steps.pre.outputs.db == 'true'
        with:
          version: latest
      - name: Apply database migrations
        if: steps.pre.outputs.db == 'true'
        working-directory: moy-sklad/backend
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.pre.outputs.app == 'true'
        with:
          node-version: '22'
      - uses: expo/expo-github-action@v8
        if: steps.pre.outputs.app == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build and submit to App Store and Google Play
        if: steps.pre.outputs.app == 'true'
        working-directory: moy-sklad/app
        run: |
          npm ci --ignore-scripts
          eas build --platform all --profile production --non-interactive --auto-submit
