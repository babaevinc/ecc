name: moy-sklad CI

on:
  push:
    branches: [main]
    paths:
      - 'moy-sklad/**'
      - '.github/workflows/moy-sklad-*.yml'
  pull_request:
    paths:
      - 'moy-sklad/**'
      - '.github/workflows/moy-sklad-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moy-sklad-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: moy-sklad

env:
  MS_ENV: ci

jobs:
  checks:
    name: Unit, Playwright (api, access control, red team), dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run checks through the orchestrator
        run: node orchestrator/run.js --stages unit,deps,e2e,access-control,red-team --dispatch none --strict
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: moy-sklad-checks
          path: moy-sklad/reports
          if-no-files-found: ignore

  semgrep:
    name: Semgrep (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install semgrep==1.97.0
      - name: Run Semgrep through the orchestrator
        run: node orchestrator/run.js --stages semgrep --dispatch none --strict
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: moy-sklad-semgrep
          path: moy-sklad/reports
          if-no-files-found: ignore

  database:
    name: Database migrations, RLS and stock functions (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MS_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Run database tests through the orchestrator
        run: node orchestrator/run.js --stages db --dispatch none --strict

  app:
    name: Mobile app typecheck and web build (demo data)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_DEMO: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install app dependencies
        working-directory: moy-sklad/app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build through the orchestrator
        run: node orchestrator/run.js --stages app --dispatch none --strict

  build:
    name: Build app (EAS preview)
    needs: [checks, semgrep, database, app]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check that the app and the Expo token exist
        id: pre
        run: |
          if [ ! -f app/package.json ]; then echo "::notice::moy-sklad/app does not exist yet — build skipped"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$EXPO_TOKEN" ]; then echo "::notice::secret EXPO_TOKEN is not set — build skipped"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.pre.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: expo/expo-github-action@v8
        if: steps.pre.outputs.ready == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build preview for Android and iOS
        if: steps.pre.outputs.ready == 'true'
        working-directory: moy-sklad/app
        run: |
          npm ci --ignore-scripts
          eas build --platform all --profile preview --non-interactive --no-wait
